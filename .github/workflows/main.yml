name: Run Morning AI Agent

on:
  workflow_dispatch: # Allows manual running from the GitHub Actions tab
  schedule:
    # Runs at 11:00 UTC every day (which is 6:00 AM CDT)
    - cron: '0 11 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip cache purge
          # ADD --no-cache-dir to force a fresh download
          pip install --no-cache-dir --upgrade google-generativeai requests python-dotenv pytz
          pip install -r requirements.txt

      - name: Create Google credentials file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Create Google token file
        run: echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Run daily briefing
        env:
          RUN_DAILY: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python -u mcp_server.py